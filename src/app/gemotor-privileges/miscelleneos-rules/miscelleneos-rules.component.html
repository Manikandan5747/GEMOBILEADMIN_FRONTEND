<div mat-dialog-title>
    Misc Rights
    <button class="dialog-close-btn" (click)="dialogRef.close()">X</button>
</div>


<mat-card class="permission-card" mat-dialog-content class="p-4">
    <div class="page-sub-title-1"> Specific Rights </div>
    <br>
    <div class="permission-list">
        <mat-checkbox *ngFor="let item of permissionList" [(ngModel)]="item.selected" labelPosition="after">
            {{ item.misc_name }}
        </mat-checkbox>
    </div>
</mat-card>

<div mat-dialog-actions style="float: right;" class="pull-right pr-2">
    <button mat-button class="btnnn-default-fn" (click)="dialogRef.close()">
        Cancel
    </button>
    <button mat-raised-button class="btnnn-prime-fn" (click)="update()">
        Save
    </button>
</div>
