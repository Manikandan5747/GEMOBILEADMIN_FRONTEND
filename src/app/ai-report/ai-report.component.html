<div class="ai-report-container">

  <h2>🤖 AI Report Assistant</h2>

  <p>
    Ask a question about your showroom reports.
  </p>

  <textarea
    [(ngModel)]="question"
    placeholder="Example: Show sales orders for this month">
  </textarea>

<button
  (click)="generateReport()"
  [disabled]="loading">

  {{ loading ? 'Generating...' : 'Generate Report' }}

</button>

<div *ngIf="response" class="report-response">

  <h3>Response</h3>

  <pre>{{ response | json }}</pre>

</div>

  <div *ngIf="question">
    <h3>Your Question</h3>
    <p>{{ question }}</p>
  </div>

</div>
