<div class="col-md-12">
    <div class="page-title"> Company </div>

    <div class="col-md-12 row">
        <div class="row" style="padding-left: 10px !important">
            <mat-form-field class="col-md-10 pr-2" appearance="outline">
                <mat-label>Search Company Detail</mat-label>
                <input matInput [(ngModel)]="search" (keyup)="applyFilter($event)" placeholder="" />
                <button mat-button *ngIf="search" matSuffix mat-icon-button aria-label="Clear" (click)="clearSearch()">
                    <mat-icon>close</mat-icon>
                </button>
            </mat-form-field>
        </div>
    </div>

    <div class="mat-table-container" id="test1" #test1>

        <table mat-table [dataSource]="dataSource" matSort>
            <ng-container matColumnDef="noData">
                <mat-footer-cell *matFooterCellDef [attr.colspan]="displayedColumns.length">
                    No records found.
                </mat-footer-cell>
            </ng-container>

            <ng-container matColumnDef="cmp_name">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Company</th>
                <td mat-cell *matCellDef="let element"> {{element?.cmp_name}} </td>
            </ng-container>


            <ng-container matColumnDef="cmp_code">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Company code </th>
                <td mat-cell *matCellDef="let element"> {{element?.cmp_code}} </td>
            </ng-container>




            <ng-container matColumnDef="status">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> status </th>
                <td mat-cell *matCellDef="let element"> {{ element.status == 1 ? 'Active' : 'In-Active'}} </td>
            </ng-container>

            <ng-container matColumnDef="createdbyname">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> created by</th>
                <td mat-cell *matCellDef="let element"> {{element?.createdbyname}} </td>
            </ng-container>


            <ng-container matColumnDef="created_at">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> created at </th>
                <td mat-cell *matCellDef="let element"> {{element?.created_at | date: DATE_FORMAT }} </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let element; columns: displayedColumns;"></tr>
        </table>

    </div>

    <mat-paginator [pageSize]="PAGE_SIZE" [pageSizeOptions]="PAGINATION_RANGE" showFirstLastButtons></mat-paginator>
</div>
