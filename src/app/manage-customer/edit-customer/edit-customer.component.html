<div mat-dialog-title>
    Edit Customer
    <button class="dialog-close-btn" (click)="dialogRef.close()">X</button>
</div>
<div class="spinner__loading" *ngIf="loading"> <mat-spinner></mat-spinner> </div>
<section mat-dialog-content>
    <app-add-edit-customer-form [platform]="platform" [isShowErrors]="isShowErrors" [action]="action" isEdit="true" [customertypes]="customertypes"
    [userpassword]="userpassword" [customerstatus]="customerstatus">

    </app-add-edit-customer-form>
</section>
<div mat-dialog-actions style="float: right;" class="pull-right pr-2">
    <button mat-raised-button class="btnnn-prime-fn" (click)="update()">
        Save
    </button>
    <button mat-button class="btnnn-default-fn" (click)="dialogRef.close()">
        Cancel
    </button>
</div>
