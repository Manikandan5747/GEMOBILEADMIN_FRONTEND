<div class="bg-img">
  <div class="main-container ">
    <div>
      <form class="p-4 authentication-form" name="loginForm" [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
        <div class="col-md-12 pt-4">
          <div style="text-align: center;"> <b class="portal " style="text-align: center;font-size: 28px !important;">
              Admin Portal </b> </div>
        </div>

        <br>
        <div class="col-md-12"> <label
            style="padding-left: 31px;font-size: 1.2rem !important;color: #000814 !important;"
            class="form-control-label">Sign In to your account</label> </div>

        <div class="form-group pt-2">
          <div class="input-group input-group-merge">
            <div class="input-group-prepend">
              <span class="input-group-text" style="padding: 0.95rem  0.75rem !important">
                <img src="../../../../assets/images/mail.svg" alt="" width="17" />
              </span>
            </div>
            <input type="text" class="form-control" formControlName="username" id="username" placeholder="User Name"
              required />
          </div>
        </div>


        <!-- <div class="form-group mt-4">
          <div class="input-group input-group-merge">
            <div class="input-group-prepend">
              <span class="input-group-text" style="padding: 0.95rem  0.75rem !important">
                <img src="../../../../assets/images/lock.svg" alt="" width="17" />
              </span>
            </div>
            <input type="password" class="form-control" formControlName="password" id="password" placeholder="Password"
              required />
          </div>
        </div> -->
        <div class="form-group mt-4">
          <div class="input-group input-group-merge">
            <div class="input-group-prepend">
              <span class="input-group-text" style="padding: 0.95rem 0.75rem !important">
                <img src="../../../../assets/images/lock.svg" alt="" width="17" />
              </span>
            </div>
            <input [type]="hide ? 'password' : 'text'" class="form-control" formControlName="password" id="password" placeholder="Password" required />
            <div class="input-group-append" style="background: #e8f0fe;">
              <button type="button" mat-icon-button (click)="togglePasswordVisibility()">
                <mat-icon>{{ hide ? 'visibility' : 'visibility_off' }}</mat-icon>
              </button>
            </div>
          </div>
        </div>
        

        
        <br>

        <div class="form-group mb-0 text-center" style="text-align: start !important;">
          <button style="width:28%;line-height: 1.6 !important;background-color:'#3c4b64';font-size: 18px !important;"
            class="btn btn-outline-dark" type="submit"> Login
          </button>


        </div>



      </form>
    </div>
  </div>
</div>
