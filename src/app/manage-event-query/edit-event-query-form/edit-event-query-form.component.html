<div *ngIf="!isLoading">
  <form [formGroup]="addEditForm" class="p-3 event-query-form">

    <!-- Page Title with Background -->
    <div class="page-title">
      Update Event Query
    
    </div>

    <!-- Query Name -->
    <mat-form-field appearance="outline" class="col-md-12">
      <mat-label>Query Name</mat-label>
      <input matInput formControlName="query_name" placeholder="Enter query name" />
    </mat-form-field>

<mat-form-field appearance="outline" class="col-md-12">
  <mat-label>Module Name</mat-label>
  <mat-select
    formControlName="table_name"
    (selectionChange)="onTableSelectionChange($event.value)">
    <mat-option *ngFor="let table of tableList" [value]="table.table_name">
      {{ table.table_name }}
    </mat-option>
  </mat-select>
</mat-form-field>





    <!-- Query Text (readonly preview) -->
    <mat-form-field appearance="outline" class="col-md-12 query-preview">
      <mat-label>Query Preview</mat-label>
      <textarea matInput formControlName="query_text" rows="4" readonly></textarea>
    </mat-form-field>

    <!-- Status -->
    <mat-form-field appearance="outline" class="col-md-12">
      <mat-label>Status</mat-label>
      <mat-select formControlName="status">
        <mat-option [value]="1">Active</mat-option>
        <mat-option [value]="0">Inactive</mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Buttons with space -->
    <div class="text-right mt-3 button-group">
      <button mat-stroked-button class="btn-cancel" type="button" (click)="onCancel()">Cancel</button>
      <button mat-raised-button  class="btn-save" type="button" (click)="update()">Update</button>
    </div>

  </form>
</div>
