<div mat-dialog-title>
    {{title}}
    <button class="dialog-close-btn" (click)="dialogRef.close()">X</button>
</div>

<section mat-dialog-content class="p-5">
    <mat-dialog-content>
        <mat-form-field class="example-full-width">
            <mat-label>{{title}}</mat-label>
            <textarea matInput  [(ngModel)]="text" rows="5" cols="30"></textarea>
          </mat-form-field>
    </mat-dialog-content>
</section>


<div mat-dialog-actions style="float: right;" class="pull-right pr-2">
    <button mat-button class="btnnn-default-fn" (click)="dialogRef.close()">
        Cancel
    </button>
    <button mat-raised-button class="btnnn-prime-fn"  [mat-dialog-close]="text" cdkFocusInitial>
        Save
    </button>
</div>
