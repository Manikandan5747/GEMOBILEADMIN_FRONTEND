
<div mat-dialog-title>
    Account
   <button class="dialog-close-btn" (click)="dialogRef.close()">X</button>
</div>
<div class="spinner__loading" *ngIf="loading">
    <mat-spinner></mat-spinner>
    </div>
<section mat-dialog-content>
   <app-add-edit-contact-form [isShowErrors]="isShowErrors"
   [countryid]="countryid"
   [stateid]="stateid"
   [accountid]="accountid" [carownertypeid]="carownertypeid" [hiddenleadtype]="hiddenleadtype" [salestype]="salestype" [leadtype]="leadtype" [purchasedetails]="purchasedetails">

   </app-add-edit-contact-form>
</section>
<div mat-dialog-actions style="float: right;" class="pull-right pr-2">
   <button mat-button class="btnnn-default-fn" (click)="dialogRef.close()">
       Cancel
   </button>
   <button mat-raised-button class="btnnn-prime-fn" (click)="update()">
       Save
   </button>
</div>
